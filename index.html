<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piper's Library</title>
  <style>
    :root {
      --bg: #dce6d3;        /* soft sage wall */
      --card: #fbf6ee;      /* pale birch */
      --ink: #2e3f30;       /* deep forest */
      --muted: #6b5a48;     /* driftwood */
      --accent: #8a5a2b;    /* walnut */
      --border: #c9ab84;    /* oak */
      --frame: #e6d2b3;     /* light oak, behind covers */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    h1 { margin: 0; font-size: 2rem; color: var(--ink); }
    .subtitle { color: var(--muted); margin-top: 0.35rem; }
    .controls {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      gap: 0.5rem;
      max-width: 900px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      background: var(--bg);
    }
    .controls input, .controls select {
      font: inherit;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
    }
    .controls input { flex: 1; min-width: 0; }
    #count { max-width: 900px; margin: 0 auto; padding: 0 1rem; color: var(--muted); font-size: 0.9rem; }
    #books {
      list-style: none;
      max-width: 900px;
      margin: 0.75rem auto 3rem;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
    }
    .book {
      background: var(--card);
      box-shadow: 0 2px 6px rgba(46, 63, 48, 0.12);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Covers come in portrait, square and landscape shapes; contain shows the
       whole cover inside a uniform frame so the grid stays even. */
    .cover {
      aspect-ratio: 1 / 1;
      width: 100%;
      object-fit: contain;
      padding: 0.1rem;
      display: block;
      background: var(--frame);
    }
    .placeholder {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      text-align: center;
      font-weight: 600;
      color: #fff;
    }
    .info { padding: 0.6rem 0.75rem 0.8rem; }
    .title { font-weight: 600; line-height: 1.25; }
    .author { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
    .meta { font-size: 0.8rem; color: var(--accent); margin-top: 0.3rem; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 2rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Piper's Library</h1>
    <div class="subtitle">Books we already have, so you don't have to guess.</div>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Search title, author, or series…" autocomplete="off">
    <select id="sort" aria-label="Sort by">
      <option value="title">Title</option>
      <option value="author">Author</option>
    </select>
  </div>
  <div id="count"></div>
  <ul id="books"></ul>

  <script src="books.js"></script>
  <script>
    const PLACEHOLDER_COLORS = ["#5f7f5a", "#8a5a2b", "#7d9a6b", "#a5713f", "#46664a", "#b08a5a"];

    const listEl = document.getElementById("books");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("search");
    const sortEl = document.getElementById("sort");

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // Leading articles are ignored when sorting by title.
    function titleKey(t) {
      return t.toLowerCase().replace(/^(the|a|an)\s+/, "");
    }

    // Sort authors by last name; books with no author sort last, by title.
    function authorKey(book) {
      if (!book.author) return "\uffff" + titleKey(book.title);
      const parts = book.author.trim().toLowerCase().split(/\s+/);
      return parts[parts.length - 1] + " " + parts.join(" ");
    }

    function placeholder(book) {
      let hash = 0;
      for (const ch of book.title) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      const color = PLACEHOLDER_COLORS[hash % PLACEHOLDER_COLORS.length];
      return `<div class="placeholder" style="background:${color}">${escapeHtml(book.title)}</div>`;
    }

    // A downloaded cover in covers/ wins; otherwise ask Open Library by ISBN.
    function cover(book) {
      let src;
      if (book.cover) {
        src = escapeHtml(book.cover);
      } else if (book.isbn) {
        const isbn = String(book.isbn).replace(/[^0-9Xx]/g, "");
        // default=false makes Open Library return 404 when it has no cover,
        // which triggers onerror and swaps in the colored placeholder.
        src = `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`;
      } else {
        return placeholder(book);
      }
      return `<img class="cover" loading="lazy" alt="" src="${src}"
        onerror="this.outerHTML = this.dataset.fallback"
        data-fallback="${escapeHtml(placeholder(book))}">`;
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const key = sortEl.value === "author" ? authorKey : b => titleKey(b.title);

      const books = BOOKS
        .filter(b => !q || [b.title, b.author, b.series, b.notes]
          .some(f => f && f.toLowerCase().includes(q)))
        .sort((a, b) => key(a).localeCompare(key(b)));

      const plural = n => `${n} book${n === 1 ? "" : "s"}`;
      countEl.textContent = q
        ? `${books.length} of ${plural(BOOKS.length)} match`
        : plural(BOOKS.length);

      listEl.innerHTML = books.length
        ? books.map(b => `
          <li class="book">
            ${cover(b)}
            <div class="info">
              <div class="title">${escapeHtml(b.title)}</div>
              ${b.author ? `<div class="author">${escapeHtml(b.author)}</div>` : ""}
              ${b.series || b.notes ? `<div class="meta">${escapeHtml([b.series, b.notes].filter(Boolean).join(" · "))}</div>` : ""}
            </div>
          </li>`).join("")
        : `<li class="empty">We don't have that one yet!</li>`;
    }

    searchEl.addEventListener("input", render);
    sortEl.addEventListener("change", render);
    render();
  </script>
</body>
</html>
